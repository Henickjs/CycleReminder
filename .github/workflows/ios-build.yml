name: iOS Build Check

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and Test (iOS)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project CycleReminder.xcodeproj \
            -scheme CycleReminder \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project CycleReminder.xcodeproj \
            -scheme CycleReminder \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned IPA for real devices
        run: |
          xcodebuild \
            -project CycleReminder.xcodeproj \
            -scheme CycleReminder \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build
          mkdir -p ipa/Payload
          cp -R build-device/Build/Products/Debug-iphoneos/CycleReminder.app ipa/Payload/
          cd ipa && zip -qr CycleReminder.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CycleReminder-ipa
          path: ipa/CycleReminder.ipa

      - name: Build summary
        if: always()
        run: echo "done"
